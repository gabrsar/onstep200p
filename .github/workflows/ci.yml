name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Public-file and documentation checks
        run: make quality
      - name: Install pinned workflow and secret scanners
        run: bash scripts/install-ci-tools.sh
      - name: Validate GitHub workflows
        run: .build/ci-tools/actionlint .github/workflows/ci.yml
      - name: Scan repository history for secrets
        run: .build/ci-tools/gitleaks git . --redact --no-banner
      - name: Host and protocol regression tests
        run: make test
      - name: Shell syntax
        run: bash -n scripts/*.sh
  firmware:
    name: Firmware (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: default
            options: SPEAKER=passive DISPLAY=on WIFI=on
          - profile: minimal
            options: SPEAKER=off DISPLAY=off WIFI=off
    env:
      ONSTEP_PUBLIC_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Arduino CLI with checksum verification
        run: |
          bash scripts/install-ci-tools.sh firmware
          printf '%s\n' "$PWD/.build/ci-tools" >> "$GITHUB_PATH"
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install pinned embedded dependencies
        run: make setup
      - name: Compile credential-free development firmware
        run: make compile ${{ matrix.options }}
      - name: Verify firmware checksum
        working-directory: build/onstepx
        run: sha256sum -c OnStepX.ino.bin.sha256
      # No automatic releases or local firmware uploads. Hardware commissioning
      # and a deliberate release review are required before distributing binaries.
