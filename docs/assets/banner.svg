<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290">
  <title>OnStep200P — a telescope with a dashboard</title>
  <desc>Original orbital artwork on a dark night-sky background.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#0a1227"/><stop offset="1" stop-color="#203652"/></linearGradient>
    <linearGradient id="light"><stop stop-color="#9aeafa"/><stop offset="1" stop-color="#73f2c3"/></linearGradient>
  </defs>
  <rect width="1000" height="290" rx="24" fill="url(#sky)"/>
  <g fill="#d7f1ff" opacity=".6"><circle cx="45" cy="40" r="2"/><circle cx="315" cy="25" r="1"/><circle cx="440" cy="70" r="2"/><circle cx="915" cy="38" r="2"/><circle cx="930" cy="240" r="1"/><circle cx="600" cy="250" r="1"/><circle cx="185" cy="260" r="2"/><circle cx="700" cy="35" r="1"/></g>
  <g transform="translate(165 136)" fill="none" stroke="url(#light)" stroke-width="3">
    <ellipse rx="97" ry="35" transform="rotate(-24)"/>
    <ellipse rx="97" ry="35" transform="rotate(48)" opacity=".45"/>
    <circle r="19" stroke-width="2"/>
    <path d="M-30 0H30M0-30V30"/>
    <circle cx="87" cy="-42" r="7" fill="#73f2c3" stroke="none"/>
  </g>
  <text x="300" y="126" fill="#f0f8ff" font-family="sans-serif" font-size="56" font-weight="700">OnStep200P</text>
  <text x="304" y="171" fill="#a7c9df" font-family="sans-serif" font-size="23">A telescope with a dashboard.</text>
  <text x="304" y="215" fill="#73f2c3" font-family="monospace" font-size="15">ESP32-S3  /  OLED  /  JOYSTICK  /  ONSTEPX</text>
</svg>
